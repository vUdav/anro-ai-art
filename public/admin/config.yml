# Конфигурация Sveltia CMS (совместима с Decap CMS)
# Документация: https://github.com/sveltia/sveltia-cms

backend:
  name: github
  repo: vUdav/anro-ai-art
  branch: main
  # Авторизация через GitHub: нужен OAuth-брокер (напр. sveltia-cms-auth на
  # Cloudflare Workers) с base_url ниже, ЛИБО вход по персональному токену
  # («Sign in with Token») без брокера. См. CONTENT_GUIDE.md.
  # base_url: https://anro-cms-auth.<subdomain>.workers.dev

# Куда CMS кладёт загруженные файлы в репозитории и как путь выглядит на сайте
media_folder: "public/media"
public_folder: "/media"

# Три языка в одном файле: вкладки RU / EN / BE в форме редактирования
i18n:
  structure: single_file
  locales: [ru, en, be]
  default_locale: ru

collections:
  # ─── Работы (портфолио) ───
  - name: works
    label: "Работы"
    label_singular: "Работа"
    folder: "src/content/works"
    create: true
    delete: true
    # slug генерируется автоматически из названия — отдельного поля нет
    identifier_field: title
    slug: "{{title}}"
    extension: json
    format: json
    i18n: true
    # В списке работ: превью (постер видео → иначе файл-изображение) + название
    summary: "{{title}}"
    thumbnail: [poster, media]
    fields:
      - { name: type, label: "Тип", widget: select, options: [image, video], default: image, i18n: duplicate }
      # Категория выбирается из коллекции «Категории» (управляется отдельно)
      - name: category
        label: "Категория"
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [name, "{{slug}}"]
        display_fields: [name]
        i18n: duplicate
      - { name: media, label: "Файл (изображение или видео)", widget: file, i18n: duplicate }
      - { name: poster, label: "Постер для видео (изображение)", widget: image, required: false, i18n: duplicate }
      - { name: externalUrl, label: "Внешняя ссылка на видео (необязательно)", widget: string, required: false, i18n: duplicate }
      - { name: featured, label: "Избранное", widget: boolean, default: false, i18n: duplicate }
      - { name: order, label: "Порядок сортировки", widget: number, default: 0, value_type: int, i18n: duplicate }
      - { name: title, label: "Название", widget: string, i18n: true }
      - { name: alt, label: "Alt-текст (для доступности)", widget: string, i18n: true }
      - { name: description, label: "Описание", widget: text, required: false, i18n: true }
      - name: tags
        label: "Теги"
        widget: list
        required: false
        i18n: true
        field: { name: tag, label: "Тег", widget: string }

  # ─── Категории работ (справочник) ───
  - name: categories
    label: "Категории работ"
    label_singular: "Категория работ"
    folder: "src/content/categories"
    create: true
    delete: true
    # slug генерируется автоматически из названия (как у работ), поля key нет
    identifier_field: name
    slug: "{{name}}"
    extension: json
    format: json
    i18n: true
    summary: "{{name}}"
    fields:
      - { name: name, label: "Название", widget: string, i18n: true }
      - { name: order, label: "Порядок", widget: number, default: 0, value_type: int, required: false, i18n: duplicate }

  # ─── Тексты разделов (синглтоны) ───
  - name: pages
    label: "Тексты разделов"
    editor: { preview: false }
    i18n: true
    files:
      - name: hero
        label: "Первый экран (Hero)"
        file: "src/content/pages/hero.json"
        format: json
        i18n: true
        fields:
          - { name: name, label: "Имя / бренд", widget: string, i18n: true }
          - { name: role, label: "Роль", widget: string, i18n: true }

      - name: about
        label: "Обо мне"
        file: "src/content/pages/about.json"
        format: json
        i18n: true
        fields:
          # duplicate: одно общее фото на все языки — редактируется в RU,
          # в EN/BE показывается только для чтения. При i18n:false Sveltia
          # прячет поле в неосновных языках и роняет его в site-рендере.
          - { name: photo, label: "Фото", widget: image, i18n: duplicate }
          - { name: fullName, label: "Полное имя (крупный текст)", widget: string, i18n: true }
          - { name: title, label: "Заголовок", widget: string, i18n: true }
          - { name: bio, label: "Биография", widget: text, i18n: true }
          - { name: credentials, label: "Регалии / достижения", widget: list, field: { name: item, label: "Пункт", widget: string }, i18n: true }

      - name: services
        label: "Услуги"
        file: "src/content/pages/services.json"
        format: json
        i18n: true
        fields:
          - name: image
            label: "Услуга «Image Creating»"
            widget: object
            i18n: true
            fields:
              - { name: title, label: "Название", widget: string, i18n: true }
              - { name: description, label: "Описание", widget: text, i18n: true }
              - { name: items, label: "Список пунктов", widget: list, field: { name: item, label: "Пункт", widget: string }, i18n: true }
          - name: video
            label: "Услуга «Video Creating»"
            widget: object
            i18n: true
            fields:
              - { name: title, label: "Название", widget: string, i18n: true }
              - { name: description, label: "Описание", widget: text, i18n: true }
              - { name: items, label: "Список пунктов", widget: list, field: { name: item, label: "Пункт", widget: string }, i18n: true }

      - name: contacts
        label: "Контакты"
        file: "src/content/pages/contacts.json"
        format: json
        i18n: true
        fields:
          - { name: telegram, label: "Ссылка на Telegram", widget: string, i18n: false }
          - { name: channel, label: "Ссылка на Telegram-канал", widget: string, i18n: false }
          - { name: orderLink, label: "Ссылка кнопки «Заказать» (Telegram)", widget: string, i18n: false }
          - { name: instagram, label: "Ссылка на Instagram", widget: string, i18n: false }
          - { name: email, label: "Email (необязательно)", widget: string, required: false, i18n: false }
          - { name: title, label: "Заголовок", widget: string, i18n: true }
          - { name: text, label: "Текст", widget: text, i18n: true }

      - name: seo
        label: "SEO"
        file: "src/content/pages/seo.json"
        format: json
        i18n: true
        fields:
          - { name: title, label: "Заголовок вкладки (title / OG)", widget: string, i18n: true }
          - { name: description, label: "Описание для поисковиков и соцсетей", widget: text, i18n: true }
          - name: keywords
            label: "Ключевые слова"
            widget: list
            required: false
            i18n: true
            field: { name: keyword, label: "Слово / фраза", widget: string }
          - { name: ogImage, label: "Картинка для соцсетей (OG, 1200×630)", widget: image, required: false, i18n: true }
          - { name: imageAlt, label: "Alt для OG-картинки", widget: string, required: false, i18n: true }
